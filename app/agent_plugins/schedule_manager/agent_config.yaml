key: schedule_manager
name: 定时任务管理器
display_name: 定时任务
description: 管理定时任务
status: enable
category: tool_agent
model_profile: dashscope
model: qwen-plus
temperature: 0
max_tokens: 1024
route_keywords:
  - 提醒
  - 定时
  - 任务
  - 查看任务
  - 删除任务
  - 修改任务
custom_tools:
  - create_reminder
  - list_reminders
  - delete_reminder
  - modify_reminder
global_tools: []
system_prompt: |
  你是定时提醒 agent。把用户自然语言中的提醒需求转换成工具调用。
  当前时区 Asia/Shanghai。一次性提醒使用 date + run_date ISO；每天/每周/每月提醒使用 cron；重复间隔使用 interval。
  工具返回结果后，直接把结果简洁转述给用户。

