# wxbot 完整配置示例
# 复制为 config.yaml 后按你的企业微信、Redis、模型和业务账号信息修改。

wechat:
  # 企业微信企业 ID
  corp_id: "YOUR_CORP_ID"

  # 企业微信 HTTP 代理，可选。
  # 支持 http://、https://、s5://、s5h://；不需要代理可填 null。
  proxy: null
  debug: false

  # 消息去重。企业微信可能重试推送，建议开启。
  enable_msg_dedup: true
  msg_dedup_ttl: 30

  oauth:
    # 企业微信 OAuth 回调域名，必须与企业微信后台配置一致。
    callback_domain: "https://your-domain.com"
    callback_domains:
      - "https://your-domain.com"

  # 每个企业微信应用绑定一组 wxbot agent 插件。
  # 注意：这里是 plugins；LangChain 工具绑定在每个 agent_config.yaml 的 custom_tools/global_tools 中。
  agents:
    "1000001":
      name: "Demo Agent"
      agent_id: 1000001
      corp_secret: "YOUR_CORP_SECRET"
      token: "YOUR_TOKEN"
      encoding_aes_key: "YOUR_ENCODING_AES_KEY"
      plugins:
        - demo_agent
        - sub_agent_demo
      fetch_user_info: false
      include_time_info: true
      oauth:
        callback_domain: "https://your-domain.com"

    "1000002":
      name: "定时提醒"
      agent_id: 1000002
      corp_secret: "YOUR_CORP_SECRET"
      token: "YOUR_TOKEN"
      encoding_aes_key: "YOUR_ENCODING_AES_KEY"
      plugins:
        - ai_schedule_manager
      fetch_user_info: false
      include_time_info: true

    # sub_agent_demo 也可以作为独立应用使用。
    "1000003":
      name: "Sub Agent Demo"
      agent_id: 1000003
      corp_secret: "YOUR_CORP_SECRET"
      token: "YOUR_TOKEN"
      encoding_aes_key: "YOUR_ENCODING_AES_KEY"
      plugins:
        - sub_agent_demo
      fetch_user_info: false
      include_time_info: true

# API Key 统一放这里。models.* 通过 api_key_config 引用这里的 key。
api_keys:
  dashscope: "YOUR_DASHSCOPE_API_KEY"

# LangChain OpenAI-compatible 模型配置。
# api_key_config: 从 api_keys.<name> 读取。
# api_key_env: api_keys 为空时可从环境变量读取。
# api_key: 也可以直接写在模型下，但不建议提交到 GitHub。
models:
  dashscope:
    model: "qwen3.6-flash"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_config: "dashscope"
    api_key_env: "DASHSCOPE_API_KEY"
    temperature: 0.7
    max_tokens: 8192

agent:
  sub_agent_notify:
    enabled: true
    delay_seconds: 1.2
    template: "我让{agent_name}处理一下，稍等。"

  middleware:
    summarization:
      enabled: true
      model_profile: dashscope
      max_tokens: 2048
      max_tokens_before_summary: 800000
      messages_to_keep: 20

redis:
  # Docker Compose 内使用 redis-stack；本地直跑可改为 127.0.0.1。
  # LangGraph Redis checkpoint 需要 Redis Stack 的 RedisJSON + RediSearch。
  host: "redis-stack"
  port: 6379
  password: null
  db: 0

deployment:
  port: 4455
  domain: "your-domain.com"
  media_url_base: "https://your-domain.com"

logging:
  level: "INFO"
  console: true
  file: true
  filename: "wxbot.log"
  max_size: "10MB"
  backup_count: 5

# APScheduler 内置定时任务配置。
# 用户通过 ai_schedule_manager 创建的提醒会单独写入 Redis 并由 scheduler leader 同步。
scheduler:
  test: false
  tasks:
    morning:
      time: "08:30"
      day_of_week: "*"
      users:
        - "user1"
        - "user2"

    today_60s:
      time: "09:50"
      day_of_week: "*"
      users:
        - "user1"

# Agent 插件不在这里定义人设。
# 人设、模型覆盖、route_keywords、custom_tools/global_tools 在：
# app/agent_plugins/<agent_key>/agent_config.yaml

